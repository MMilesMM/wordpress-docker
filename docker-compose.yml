# Single WordPress site with its own MariaDB and Redis.
# Settings and secrets go into .env (see env.example).

services:
  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      # root can only log in from inside the db container (applies on first start)
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: wordpress
      MARIADB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    environment:
      # used by redis-cli in the healthcheck
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Object cache only: password, bounded memory, no persistence.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    image: ${WORDPRESS_IMAGE:-mmilesmm/wordpress-apache-php-fix:5.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Only what WordPress needs. The MariaDB root password is not passed in.
    environment:
      TZ: ${TZ:-Europe/Berlin}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        // Behind a reverse proxy. Headers are trusted from everyone by default,
        // which is safe while the port is bound to 127.0.0.1 (BIND_ADDRESS).
        // If the port is reachable from the network, set WP_TRUSTED_PROXIES to
        // the proxy's IP(s) so nobody else can fake HTTPS or the client IP.
        $$_wp_trusted = array_filter(array_map('trim', explode(',', '${WP_TRUSTED_PROXIES:-}')));
        if (!$$_wp_trusted || in_array($$_SERVER['REMOTE_ADDR'] ?? '', $$_wp_trusted, true)) {
          if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') {
            $$_SERVER['HTTPS'] = 'on';
          }
          if (!empty($$_SERVER['HTTP_X_FORWARDED_FOR'])) {
            // The last entry is the one appended by our own proxy.
            $$_wp_xff = array_map('trim', explode(',', $$_SERVER['HTTP_X_FORWARDED_FOR']));
            $$_SERVER['REMOTE_ADDR'] = end($$_wp_xff);
          }
        } else {
          // Not from a trusted proxy: undo what the official image's wp-config
          // already derived from X-Forwarded-Proto (the container itself only
          // speaks plain HTTP, so HTTPS can never be legitimately on here).
          unset($$_SERVER['HTTPS'], $$_SERVER['HTTP_X_FORWARDED_PROTO'], $$_SERVER['HTTP_X_FORWARDED_FOR']);
        }
        define('DISALLOW_FILE_EDIT', true);

        // Automatic updates for all plugins and themes (WP_AUTO_UPDATE_EXTENSIONS).
        // wp-config runs before the plugin API is loaded, so the filters are
        // pre-registered via $$wp_filter (supported by WordPress since 4.7).
        if (${WP_AUTO_UPDATE_EXTENSIONS:-false}) {
          $$GLOBALS['wp_filter']['auto_update_plugin'][10][] = ['function' => '__return_true', 'accepted_args' => 1];
          $$GLOBALS['wp_filter']['auto_update_theme'][10][] = ['function' => '__return_true', 'accepted_args' => 1];
        }

        // Redis Object Cache plugin
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', '${REDIS_PASSWORD}');
    volumes:
      - ./wordpress_data:/var/www/html
      - ./wordpress.ini:/usr/local/etc/php/conf.d/wordpress.ini:ro
    ports:
      # 127.0.0.1 = only a reverse proxy on this host can reach the site (default)
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    healthcheck:
      # Exercises PHP and the database; redirects count as healthy.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -m 8 http://127.0.0.1/wp-login.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  default:
    driver_opts:
      # Must not be larger than the host's MTU. Clouds like OpenStack often use
      # 1450; with the default 1500, TLS connections from the containers hang.
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}
